# T3MP3ST CTF Infrastructure
# Docker Compose configuration for execution-based benchmarks
#
# Usage:
#   docker compose up -d                    # Start all challenges
#   docker compose up -d sqli-basic         # Start specific challenge
#   docker compose down                     # Stop all
#   docker compose logs -f sqli-basic       # View logs

version: '3.8'

services:
  # ============================================================
  # WEB EXPLOITATION CHALLENGES
  # ============================================================

  sqli-basic:
    build:
      context: ./docker/web/sqli-basic
      dockerfile: Dockerfile
    container_name: ctf_sqli_basic
    ports:
      - "8080:80"
    environment:
      - CTF_FLAG=T3MP3ST{sql1_l0g1n_byp4ss_ez}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ctf-network
    labels:
      - "ctf.category=web_exploitation"
      - "ctf.difficulty=1"
      - "ctf.points=100"

  sqli-blind:
    build:
      context: ./docker/web/sqli-blind
      dockerfile: Dockerfile
    container_name: ctf_sqli_blind
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    networks:
      - sqli-blind-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      - "ctf.category=web_exploitation"
      - "ctf.difficulty=2"
      - "ctf.points=200"

  sqli-blind-gateway:
    build:
      context: ./docker/web/sqli-blind
      dockerfile: Dockerfile
    entrypoint: ["python", "proxy.py"]
    depends_on:
      sqli-blind:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    networks:
      - sqli-blind-edge
      - sqli-blind-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 10

  xss-stored:
    build:
      context: ./docker/web/xss-stored
      dockerfile: Dockerfile
    container_name: ctf_xss_stored
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    environment:
      - CTF_FLAG=T3MP3ST{st0r3d_xss_c00kie_th3ft}
      - CALLBACK_BASE=
      - CALLBACK_PATH=/cb
    depends_on:
      xss-callback:
        condition: service_healthy
    networks:
      - xss-callback-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      - "ctf.category=web_exploitation"
      - "ctf.difficulty=2"
      - "ctf.points=200"

  xss-gateway:
    build:
      context: ./docker/web/xss-stored
      dockerfile: Dockerfile
    entrypoint: ["python", "proxy.py"]
    depends_on:
      xss-stored:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8080"
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.5
    environment:
      - UPSTREAM=http://xss-stored:8080
      - CALLBACK=http://xss-callback:9999
    networks:
      - xss-callback-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 10

  xss-callback:
    build:
      context: ./docker/web/xss-stored
      dockerfile: Dockerfile
    entrypoint: ["python", "-u", "callback.py"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 16
    mem_limit: 128m
    cpus: 0.5
    environment:
      - CALLBACK_PORT=9999
      - CALLBACK_LOG=/tmp/xss-callback.log
    networks:
      - xss-callback-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://localhost:9999/health', timeout=2); r.read()"]
      interval: 5s
      timeout: 3s
      retries: 10

  ssrf-metadata:
    build:
      context: ./docker/web/ssrf-metadata
      dockerfile: Dockerfile
    container_name: ctf_ssrf_metadata
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    user: "65532:65532"
    environment:
      - CTF_FLAG=T3MP3ST{ssrf_m3t4d4t4_c4ptur3}
    depends_on:
      ssrf-mock:
        condition: service_healthy
    networks:
      - ssrf-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      - "ctf.category=web_exploitation"
      - "ctf.difficulty=3"
      - "ctf.points=300"

  ssrf-metadata-gateway:
    build:
      context: ./docker/web/ssrf-metadata
      dockerfile: Dockerfile
    entrypoint: ["python", "proxy.py"]
    depends_on:
      ssrf-metadata:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:8080"
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    user: "65532:65532"
    environment:
      - UPSTREAM=http://ssrf-metadata:8080
    networks:
      - ssrf-internal-edge
      - ssrf-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 10

  ssrf-mock:
    build:
      context: ./docker/web/ssrf-metadata
      dockerfile: Dockerfile
    entrypoint: ["python", "-u", "metadata_mock.py"]
    user: "65532:65532"
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 16
    mem_limit: 128m
    cpus: 0.5
    environment:
      - CTF_FLAG=T3MP3ST{ssrf_m3t4d4t4_c4ptur3}
      - PORT=80
    networks:
      ssrf-internal:
        ipv4_address: 169.254.169.254
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://localhost:80/health', timeout=2); r.read()"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ============================================================
  # BINARY EXPLOITATION CHALLENGES
  # ============================================================

  bof-basic:
    build:
      context: ./docker/pwn/bof-basic
      dockerfile: Dockerfile
    container_name: ctf_bof_basic
    ports:
      - "9001:9001"
    environment:
      - CTF_FLAG=T3MP3ST{b4s1c_buff3r_0v3rfl0w}
    restart: unless-stopped
    networks:
      - ctf-network
    labels:
      - "ctf.category=binary_exploitation"
      - "ctf.difficulty=1"
      - "ctf.points=100"

  format-string:
    image: t3mp3st/ctf-format-string:local
    build:
      context: ./docker/pwn/format-string
      dockerfile: Dockerfile
    container_name: ctf_format_string
    ports:
      - "127.0.0.1:9002:9002"
    environment:
      - CTF_FLAG=T3MP3ST{f0rm4t_str1ng_wr1t3}
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    user: "65532:65532"
    networks:
      - format-string-internal
    healthcheck:
      test: ["CMD", "/challenge/vuln", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      - "ctf.category=binary_exploitation"
      - "ctf.difficulty=2"
      - "ctf.points=250"

  # ============================================================
  # CRYPTOGRAPHY CHALLENGES
  # ============================================================

  rsa-weak:
    image: t3mp3st/ctf-rsa-weak:local
    build:
      context: ./docker/crypto/rsa-weak
      dockerfile: Dockerfile
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    networks:
      - rsa-weak-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      - "ctf.category=cryptography"
      - "ctf.difficulty=1"
      - "ctf.points=100"

  rsa-weak-gateway:
    image: t3mp3st/ctf-rsa-weak:local
    entrypoint: ["python", "proxy.py"]
    depends_on:
      rsa-weak:
        condition: service_healthy
    ports:
      - "127.0.0.1:9101:8080"
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    networks:
      - rsa-weak-edge
      - rsa-weak-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ============================================================
  # ATTACKER / TOOLING SIDECAR
  # ============================================================

  # Kali box with the offensive tooling (metasploit, hydra, nmap, seclists, …) on the CTF network.
  # Lets you attack the challenge containers entirely in Docker — nothing installed on the host.
  # Start it with:   docker compose up -d attacker
  # Get a shell:     docker exec -it ctf_attacker bash
  # From inside, reach challenges by service name, e.g.:  nmap sqli-basic  ·  msfconsole -q
  attacker:
    build:
      context: ./docker/attacker
      dockerfile: Dockerfile
    container_name: ctf_attacker
    # Not started with the default `up` — it's a heavy image; bring it up explicitly (or with --profile).
    profiles: ["attacker"]
    stdin_open: true
    tty: true
    # cap_add gives raw-socket tools (nmap -sS, etc.) what they need; drop if you want it locked down.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    networks:
      - ctf-network
    labels:
      - "ctf.role=attacker"

  # T3MP3ST server running INSIDE the tooling image (Kali + metasploit/hydra/nmap on PATH), so the
  # arsenal can actually drive the post-ex/credential tools and the War Room capability check goes
  # green. Build the `attacker` image first (it's the base):
  #   docker compose --profile attacker build attacker
  #   docker compose --profile attacker up -d t3mp3st
  # Then open the containerized War Room at  http://localhost:3334/ui  (host 3334 → container 3333,
  # so it never clashes with a T3MP3ST you're already running on the host's 3333).
  t3mp3st:
    build:
      context: ..                                   # repo root — COPY . . pulls the project
      dockerfile: ctf/docker/t3mp3st/Dockerfile
    image: ctf-t3mp3st
    container_name: ctf_t3mp3st
    profiles: ["attacker"]
    depends_on:
      - attacker
    # API keys come from the repo .env (openrouter/anthropic/…). The container has no host SOCKS
    # proxy and no Supabase config, so override those two to sane in-container defaults.
    env_file:
      - ../.env
    environment:
      - DOCKER=true                                 # bind 0.0.0.0
      - T3MP3ST_FULL_ARSENAL=1                       # arm the post-ex/credential drivers
      - T3MP3ST_STATE_BACKEND=memory                # no Supabase inside the container
      - TEMPEST_PROXY_URL=                          # no host 127.0.0.1:1080 SOCKS proxy in-container
    ports:
      - "3334:3333"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    networks:
      - ctf-network
    restart: unless-stopped
    labels:
      - "ctf.role=t3mp3st-server"

  # ============================================================
  # INFRASTRUCTURE SERVICES
  # ============================================================

  # Webhook receiver for XSS/SSRF data exfiltration
  webhook-receiver:
    image: python:3.11-slim
    container_name: ctf_webhook_receiver
    command: |
      python -c "
      from http.server import HTTPServer, BaseHTTPRequestHandler
      import json

      received_data = []

      class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
              received_data.append({'path': self.path, 'headers': dict(self.headers)})
              self.send_response(200)
              self.end_headers()
              self.wfile.write(b'OK')

          def do_POST(self):
              length = int(self.headers.get('Content-Length', 0))
              body = self.rfile.read(length).decode()
              received_data.append({'path': self.path, 'body': body})
              self.send_response(200)
              self.end_headers()
              self.wfile.write(b'OK')

          def log_message(self, format, *args):
              pass

      print('Webhook receiver listening on :9999')
      HTTPServer(('0.0.0.0', 9999), Handler).serve_forever()
      "
    ports:
      - "9999:9999"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - ctf-network

# ============================================================
# NETWORKS
# ============================================================

networks:
  format-string-internal:
    driver: bridge
    internal: true

  ctf-network:
    driver: bridge
    name: ctf-network

  ssrf-internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 169.254.169.0/24

  ssrf-internal-edge:
    driver: bridge

  rsa-weak-internal:
    driver: bridge
    internal: true

  rsa-weak-edge:
    driver: bridge

  sqli-blind-internal:
    driver: bridge
    internal: true

  sqli-blind-edge:
    driver: bridge

  xss-callback-internal:
    driver: bridge
    internal: true
